<div class="container w-50">

    <h1>{{ titulo ? "Actualizar Docente" : "Nuevo Docente" }}</h1>

    <form [formGroup]="frmDocente" novalidate (submit)="guardar()">

        @if(titulo){
        <div class="col-12 col-md-2">
            <label for="id" class="form-label">Id</label>
            <input id="id" type="number" class="form-control" formControlName="id" readonly />
        </div>
        }

        <div class="col-12 col-md-6">
            <label for="nombres" class="form-label">Nombres</label>
            <input id="nombres" type="text" class="form-control" formControlName="nombres" />
        </div>

        <div class="col-12 col-md-6">
            <label for="apellidos" class="form-label">Apellidos</label>
            <input id="apellidos" type="text" class="form-control" formControlName="apellidos" />
        </div>

        <div class="col-12 col-md-6">
            <label for="materia" class="form-label">Materia</label>
            <input id="materia" type="text" class="form-control" formControlName="materia" />
        </div>

        <div class="col-12 col-md-6">
            <label for="telefono" class="form-label">Teléfono</label>
            <input id="telefono" type="text" class="form-control" formControlName="telefono" />
        </div>

        <div class="col-12 col-md-6">
            <label for="email" class="form-label">Email</label>
            <input id="email" type="email" class="form-control" formControlName="email" />
        </div>

        <div class="col-12 col-md-6">
            <label for="servicio" class="form-label">Servicio</label>
            <input id="servicio" type="text" class="form-control" formControlName="servicio" />
        </div>

        <div class="col-12 col-md-6">
            <label for="cantidad" class="form-label">Cantidad</label>
            <input id="cantidad" type="number" class="form-control" formControlName="cantidad" />
        </div>

        <div class="col-12 col-md-6">
            <label for="precio" class="form-label">Precio</label>
            <input id="precio" type="number" class="form-control" formControlName="precio" />
        </div>

        <div class="col-12 col-md-6">
            <label for="iva" class="form-label">Iva</label>
            <input id="iva" type="number" class="form-control" formControlName="iva" />
        </div>

        <div class="col-12 col-md-6 mt-3">
            <button type="submit" class="btn btn-success me-3" [disabled]="!frmDocente.valid">Guardar</button>
            <button class="btn btn-secondary" [routerLink]="['/docentes']">Cancelar</button>
        </div>

    </form>
</div>
